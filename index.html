    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #171920;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    /* Продолжение фотографии для широких экранов. */
    body::before {
      content: "";
      position: fixed;
      inset: -45px;
      background-image: linear-gradient(#12192355, #12192388), var(--photo);
      background-position: center;
      background-size: cover;
      filter: blur(32px) brightness(.58);
      transform: scale(1.045);
      pointer-events: none;
    }
    .landing {
      position: relative;
      width: min(100%, max(320px, 56.0547dvh), 620px);
      height: 100vh;
      height: 100dvh;
      isolation: isolate;
      overflow: hidden;
      background: #302e31;
      box-shadow: 0 10px 65px #00000035;
    }
    .photo {
      position: absolute;
      inset: 0;
      background-image: var(--photo);
      background-size: cover;
      background-position: center top;
    }
    .landing::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, transparent 28%, #09213a09 52%, #0817272e 100%);
      pointer-events: none;
    }
    /* Кнопка находится чуть ниже центра фотографии, а не внизу экрана. */
    .cta-wrap {
      position: absolute;
      z-index: 2;
      top: 56%;
      left: 50%;
      width: min(340px, calc(100% - 42px));
      transform: translate(-50%, -50%);
      animation: enter .9s cubic-bezier(.16, 1, .3, 1) both;
    }
    .cta-wrap::before {
      content: "";
      position: absolute;
      inset: -12px;
      z-index: -1;
      border-radius: 25px;
      background: radial-gradient(ellipse, #67d5ff77 0%, #4ebcff22 46%, transparent 73%);
      filter: blur(11px);
      pointer-events: none;
      animation: aura 3.2s ease-in-out infinite;
    }
    .telegram {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 68px;
      padding: 13px 20px;
      overflow: hidden;
      border: 2px solid #fff;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(118, 218, 255, .72) 0%, rgba(44, 167, 237, .71) 49%, rgba(9, 114, 202, .73) 100%);
      color: white;
      font-size: clamp(21px, 5.5vw, 26px);
      font-weight: 750;
      line-height: 1.15;
      letter-spacing: .25px;
      text-align: center;
      text-decoration: none;
      text-shadow: 0 1px 2px #07538eaa;
      box-shadow: inset 0 2px 0 #ffffffa6, inset 0 -3px 0 #07508b85, 0 5px 0 #075184c4, 0 13px 23px #00192f83;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      animation: buttonFloat 3.2s ease-in-out infinite;
      transition: filter .2s ease;
    }
    .telegram::before {
      content: "";
      position: absolute;
      inset: -20% auto -20% -55%;
      width: 34%;
      background: linear-gradient(90deg, transparent, #ffffff13 20%, #ffffffa8 50%, #ffffff13 80%, transparent);
      transform: skewX(-24deg) translateX(-180%);
      pointer-events: none;
      animation: shine 3.6s ease-in-out 1s infinite;
    }
    .telegram::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 11px;
      right: 11px;
      height: 38%;
      border-radius: 9px 9px 60% 60%;
      background: linear-gradient(#ffffff43, transparent);
      pointer-events: none;
    }
    .telegram span { position: relative; z-index: 1; }
    .telegram:hover { filter: brightness(1.13); }
    .telegram:active { animation-play-state: paused; filter: brightness(.94); }
    .telegram:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
    @keyframes enter {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 38px)) scale(.9); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes buttonFloat {
      0%, 100% { transform: translateY(0); box-shadow: inset 0 2px 0 #ffffffa6, inset 0 -3px 0 #07508b85, 0 5px 0 #075184c4, 0 13px 23px #00192f83; }
      50% { transform: translateY(-7px); box-shadow: inset 0 2px 0 #ffffffc0, inset 0 -3px 0 #07508b85, 0 8px 0 #075184b8, 0 18px 30px #003a6c9c; }
    }
    @keyframes shine {
      0%, 15% { left: -55%; }
      49%, 100% { left: 140%; }
    }
    @keyframes aura {
      0%, 100% { opacity: .5; transform: scale(.97); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cta-wrap, .cta-wrap::before, .telegram, .telegram::before { animation: none; }
      .telegram { transition: none; }
    }
    @media (max-height: 480px) { .telegram { min-height: 54px; } }
  </style>
